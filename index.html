<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Página de Login</title>
    <link rel="stylesheet" href="style.css" />
    
  </head>

  <body>
    <h1>Página de LOGIN</h1>

    <form id="FL">
        <label for="nome">Usuário:</label>
        <input type="text" id="nome" name="nome" required>
        <br><br>

        <label for="Senha">Senha:</label>
        <input type="password" id="Senha" name="Senha" required>
        <br><br>

        <button id="Enviar" type="submit">Logar</button>
    </form>

    <!-- Onde o "print" será mostrado -->
    <div id="resultado" style="margin-top: 20px; color: white; text-align: center;"></div>
    <script>
        const form = document.getElementById("FL");
const resultado = document.getElementById("resultado");

const nome = document.getElementById("nome");
const senha = document.getElementById("Senha"); // <-- agora com "s" minúsculo

form.addEventListener("submit", function(event) {
  event.preventDefault(); // Evita que a página recarregue

  resultado.innerHTML = `
    <h2>Dados Recebidos:</h2>
    <p><strong>Usuário:</strong> ${nome.value}</p>
    <p><strong>Senha:</strong> ${senha.value}</p>
  `;
});

    </script>

  </body>
</html>
