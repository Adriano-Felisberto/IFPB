<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Login</title>
  </head>
  <body style="background-color: gray; text-align: center">
    <h1><strong>Página de LOGIN</strong></h1>

    <form
      id="fl"
      onsubmit="enviarFormulario(event)"
      style="
        display: inline-block;
        background: white;
        font-size: 18px;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
        width: 400px;
      "
    >
      <p>
        <strong>Usuário: </strong>
        <input
          type="text"
          name="usuario"
          id="usuario"
          placeholder="Nome completo"
          style="border-radius: 5px"
          required
        />
      </p>
      <p>
        <strong>Senha: </strong>
        <input
          type="password"
          name="senha"
          id="senha"
          placeholder="Senha de usúario"
          style="border-radius: 5px"
          required
        />
      </p>
      <p>
        <strong>Data de nascimento:</strong>
        <input
          type="date"
          name="data"
          id="data"
          style="border-radius: 5px"
          required
        />
      </p>
      <p>
        <strong>Email: </strong>
        <input type="email" style="border-radius: 5px" placeholder="Email do usúario" required />
      </p>
      <button type="submit" style="border-radius: 10px">Enviar</button>
      <button type="reset" style="border-radius: 10px">Resetar</button>
    </form>

    <script>
      function enviarFormulario(event) {
        alert("Dados enviados!");
      }
    </script>
  </body>
</html>
