<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            background-color: gray;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        #visor {
            width: 250px;
            height: 50px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 10px;
            padding: 5px;
        }

        #botoes {
            display: inline-block;
        }

        button {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 18px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <header>
    <h1>Calculadora</h1>
    <input type="text" id="visor" disabled>
    </header>
    <main id="botoes">
        <button onclick="inserir('1')">1</button>
        <button onclick="inserir('2')">2</button>
        <button onclick="inserir('3')">3</button>
        <button onclick="inserir('+')">+</button>
        <br>
        <button onclick="inserir('4')">4</button>
        <button onclick="inserir('5')">5</button>
        <button onclick="inserir('6')">6</button>
        <button onclick="inserir('-')">-</button>
        <br>
        <button onclick="inserir('7')">7</button>
        <button onclick="inserir('8')">8</button>
        <button onclick="inserir('9')">9</button>
        <button onclick="inserir('*')">*</button>
        <br>
        <button onclick="inserir('0')">0</button>
        <button onclick="inserir('/')">/</button>
        <button onclick="calcular()">=</button>
        <button onclick="limpar()">C</button>
    </main>

    <script>
        function inserir(valor) {
            document.getElementById('visor').value += valor;
        }

        function calcular() {
            try {
                const resultado = eval(document.getElementById('visor').value);
                document.getElementById('visor').value = resultado;
            } catch {
                document.getElementById('visor').value = 'Erro';
            }
        }

        function limpar() {
            document.getElementById('visor').value = '';
        }
    </script>
</body>
</html>
