<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: gray;
        text-align: center;
        font-size: 16px;
        font-family: Arial;
      }
      #teste {
        background-color: beige;
        border-radius: 5px;
        margin: 10px;
      }
      h6 {
        color: blue;
      }
      form {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        margin: 0 auto; /* centraliza na tela */
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
      }
      input {
        padding: 10px;
        margin: 8px 0;
        width: 90%;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 14px;
      }
      button {
        padding: 10px 20px;
        margin: 8px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }
    </style>
    <script>
      function alerta() {
        let formulario = document.getElementById("formu");
        let usuario = document.getElementById("usuario");
        let senha = document.getElementById("senha");
        alert("ola " + usuario.value); // .valor serve para pegar algum valor como o exemplo presente
        alert("sua senha é " + senha.value);
      }

      function envio(event) {
        event.preventDefault(); // evita que o form recarregue a página
        alert("Formulário enviado!");
      }
    </script>
  </head>
  <body>
    <header>
      <h1>Não sei kkkk</h1>
    </header>
    <main>
      <form id="formu" onsubmit="envio(event)">
        <label for="usuario">Usuário:</label>
        <input id="usuario" name="usuario" /><br /><br />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" /><br />

        <a href="recu.html"
          ><small><us style="color: blue">Esqueceu a senha?</us></small></a
        ><br /><br />

        <button type="submit" id="envio">Envio</button>
        <button type="button" onclick="alerta()" id="teste">Alerta</button>
      </form>
    </main>
  </body>
</html>
