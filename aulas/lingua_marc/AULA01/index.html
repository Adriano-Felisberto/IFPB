<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeira Página</title>

    <style>
      body {
        background-color: gray;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      #header {
        background-color: white;
        border-radius: 10px;
        width: 50%;
        margin: 50px auto;
        padding: 20px;
      }

      #principal {
        background-color: white;
        border-radius: 10px;
        padding: 20px;
        width: 50%;
        margin: 50px auto;
        font-size: large;
      }

      a button {
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background-color: #4caf50;
        color: white;
        cursor: pointer;
      }

      a button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <header id="header">
      <h1>Aula 01</h1>
      <h2>Aula 01</h2>
      <h3>Aula 01</h3>
      <h4>Aula 01</h4>
      <h5>Aula 01</h5>
      <h6>Aula 01</h6>

      <strong>Texto em negrito</strong><br />
      <em>Texto em itálico</em><br />
      <sub>Esse texto é subscrito</sub><br />
      <u>Texto sublinhado</u><br />
      <pre>Texto pré-formatado</pre>
    </header>

    <main id="principal">
      <p>Consegui uma página HTML!</p>
      <hr color="red" />

      <!-- Botão que leva para o site do IFPB -->
      <a href="https://estudante.ifpb.edu.br" target="_blank">
        <button>Clique aqui</button>
      </a>
      <br><br>
      <a href="imagem.html">
      <button>acesse a imagem</button></a>
    </main>
  </body>
</html>
